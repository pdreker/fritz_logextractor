on:
  push:
    branches:
      - main

name: release-please
jobs:
  release:
    runs-on: ubuntu-latest
    # The repository default token is read-only; release-please pushes a
    # release branch and opens a PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
