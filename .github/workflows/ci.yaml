name: CI

# Shared workflow: pdreker/github-workflows.

on:
  # Every pull request, whatever it targets; push only on main, since a branch push is
  # already covered by its pull request.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: pdreker/github-workflows/.github/workflows/python-ci.yaml@86c4e71ad830e8a10c9819193ec8b9720b4bd57b # v1.1.0
    with:
      extra-run: uv run mkdocs build --strict
